<div class="verse-card" data-entry-id="356">
  <blockquote class="verse-original">14.9或问子产。子曰：“惠人也。”问子西⑴。曰：“彼哉！彼哉⑵！”问管仲。曰：“人也。夺伯氏⑶骈邑⑷三百，饭疏食，没齿无怨言。”</blockquote>
  <p class="verse-translation">【译文】有人向孔子问子产是怎样的人物。孔子道：“是宽厚慈惠的人。”又问到子西。孔子道：“他呀，他呀！”又问到管仲。孔子道：“他是人才。剥夺了伯氏骈邑三百户的采地，使伯氏只能吃粗粮，到死没有怨恨的话。”</p>
