<script type="module">
 (async () => {
  let sdk;
  try {
    sdk = new AnalectsSDK({
      supabaseUrl: 'https://btqbtibvevglwcpiewyu.supabase.co',
      supabaseKey: 'sb_publishable_Kl_dygwfqk0Uey1G-0rj3A_4sbCgnet'
    });

    await sdk.init();
    sdk.renderGlobalHeader();

    const container = document.getElementById('notes-list-container');
    const chapterSelect = document.getElementById('my-chapter-select');
    const sortSelect = document.getElementById('my-sort-select');
    const searchInput = document.getElementById('notes-search-input');

    // 篇目选项
    const chapters = [
      '学而篇 第一','为政篇 第二','八佾篇 第三','里仁篇 第四','公冶长篇 第五',
      '雍也篇 第六','述而篇 第七','泰伯篇 第八','子罕篇 第九','乡党篇 第十',
      '先进篇 第十一','颜渊篇 第十二','子路篇 第十三','宪问篇 第十四','卫灵公篇 第十五',
      '季氏篇 第十六','阳货篇 第十七','微子篇 第十八','子张篇 第十九','尧曰篇 第二十'
    ];

    if (chapterSelect) {
      chapterSelect.innerHTML = ['<option value="">全部篇目</option>']
        .concat(chapters.map((name, i) => `<option value="${i + 1}">${sdk.escapeHtml(name)}</option>`))
        .join('');
    }

    // URL 回填
    const urlParams = new URLSearchParams(window.location.search);
    const initialChapter = urlParams.get('chapter_index') || '';
    const initialSort = urlParams.get('sort') || 'favorited_at_desc';
    const initialKeyword = urlParams.get('q') || '';

    if (chapterSelect) chapterSelect.value = initialChapter;
    if (sortSelect) sortSelect.value = initialSort;
    if (searchInput) searchInput.value = initialKeyword;

    // 初次渲染
    await sdk.renderMyNotesPageV3(container, {
      chapterIndex: initialChapter ? parseInt(initialChapter, 10) : null,
      sort: initialSort,
      keyword: initialKeyword
    });
    // 搜索策略（v3.2）
    // 统一为“全量搜索”. 输入后 debounce 触发 RPC. 可搜索所有笔记, 不限已显示
    // 回车立即搜索. Esc 清空并恢复全量列表

    let searchDebounceTimer = null;

    async function applyAndReload({ scrollTop = true } = {}) {
      const chapterIndex = chapterSelect && chapterSelect.value ? parseInt(chapterSelect.value, 10) : null;
      const sort = sortSelect ? sortSelect.value : 'favorited_at_desc';
      const keyword = searchInput ? searchInput.value.trim() : '';

      // 同步到 URL, 便于刷新保持状态
      const next = new URLSearchParams(window.location.search);
      if (chapterIndex) next.set('chapter_index', String(chapterIndex)); else next.delete('chapter_index');
      if (sort) next.set('sort', sort); else next.delete('sort');
      if (keyword) next.set('q', keyword); else next.delete('q');
      const qs = next.toString();
      window.history.replaceState({}, '', qs ? `${window.location.pathname}?${qs}` : window.location.pathname);

      await sdk.renderMyNotesPageV3(container, { chapterIndex, sort, keyword, reset: true });

      if (scrollTop) window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    if (chapterSelect) chapterSelect.addEventListener('change', () => applyAndReload());
    if (sortSelect) sortSelect.addEventListener('change', () => applyAndReload());

    if (searchInput) {
      searchInput.addEventListener('input', () => {
        if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
        searchDebounceTimer = setTimeout(() => {
          applyAndReload({ scrollTop: false });
        }, 350);
      });

      searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
          applyAndReload({ scrollTop: false });
        } else if (e.key === 'Escape') {
          e.preventDefault();
          if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
          searchInput.value = '';
          applyAndReload({ scrollTop: false });
        }
      });
    }

    // 打印 / 保存为 PDF
    const printBtn = document.getElementById('print-pdf-btn');
    if (printBtn) {
      printBtn.addEventListener('click', () => window.print());
    }

    const yearEl = document.getElementById('year');
    if (yearEl) yearEl.textContent = new Date().getFullYear();

  } catch (e) {
    console.error("AnalectsSDK failed to initialize.", e);
    const c = document.getElementById('notes-list-container');
    if (c) c.innerHTML = '<div class="text-center text-red-500 py-8">SDK 初始化失败，请检查配置。</div>';
  }
 })();
</script>
