<div class="verse-card" data-entry-id="478">
  <blockquote class="verse-original">18.5楚狂接舆⑴歌而过孔子曰：“凤兮凤兮！何德之衰？往者不可谏，来者犹可追⑵。已而，已而！今之从政者殆而！”孔子下，欲与之言。趋而辟之，不得与之言。</blockquote>
  <p class="verse-translation">楚国的狂人接舆一面走过孔子的车子，一面唱着歌，道：“凤凰呀，凤凰呀！为什么这么倒霉？过去的不能再挽回，未来的还可不再着迷。算了吧，算了吧！现在的执政诸公危乎其危！”孔子下车，想同他谈谈，他却赶快避开，孔子没法同他谈。</p>
