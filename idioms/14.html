<div class="verse-card" data-entry-id="102">
  <blockquote class="verse-original">5.10宰予昼寝。子曰：“朽木不可雕也；粪土之墙不可杇⑴也；于予与何诛⑵”子曰⑶：“始吾于人也，听其言而信其行；今吾于人也，听其言而观其行。于予与改是。”</blockquote>
  <p class="verse-translation">宰予在白天睡觉。孔子说：“腐烂了的木头雕刻不得，粪土似的墙壁粉刷不得；对于宰予么，不值得责备呀。”又说：“最初，我对人家，听到他的话，便相信他的行为；今天，我对人家，听到他的话，却要考察他的行为。从宰予的事件以后，我改变了态度。”</p>
