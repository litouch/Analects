<div class="verse-card" data-entry-id="1">
  <blockquote class="verse-original">1.1子⑴曰：“学而时⑵习⑶之，不亦说⑷乎？有朋⑸自远方来，不亦乐乎？人不知⑹，而不愠⑺，不亦君子⑻乎？”</blockquote>
  <p class="verse-translation">孔子说：“学了，然后按一定的时间去实习它，不也高兴吗？有志同道合的人从远处来，不也快乐吗？人家不了解我，我却不怨恨，不也是君子吗？”</p>
